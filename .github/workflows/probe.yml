name: Étape 0 - test MT5 et historique

on:
  workflow_dispatch:
  push:
    paths: [scripts/probe.py, scripts/install_mt5.ps1, .github/workflows/probe.yml]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de MetaTrader 5
        shell: pwsh
        run: ./scripts/install_mt5.ps1
      - name: Dépendances Python
        run: pip install MetaTrader5
      - name: Connexion, règles XAUUSD et historique
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python scripts/probe.py data
      - uses: actions/upload-artifact@v4
        with:
          name: historique-xauusd
          path: data/*.csv.gz
          retention-days: 30
