name: Historique multi-actifs (MT5)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Actifs (séparés par des espaces)"
        default: "XAUUSD XAGUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF US500 SP500 NAS100 USTEC DE40 GER40"
  push:
    paths: [scripts/fetch_history.py, .github/workflows/history.yml]

permissions:
  contents: write

jobs:
  history:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de MetaTrader 5
        shell: pwsh
        run: ./scripts/install_mt5.ps1
      - run: pip install numpy MetaTrader5
      - name: Téléchargement H1
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python scripts/fetch_history.py data/mt5 ${{ inputs.symbols || 'XAUUSD XAGUSD EURUSD GBPUSD USDJPY AUDUSD USDCHF US500 SP500 NAS100 USTEC DE40 GER40' }}
      - name: Enregistrement dans le dépôt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mt5
          git commit -qm "Historique H1 multi-actifs (MT5)" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
