name: Session live (démo) - spécialistes

# Séance 12h-18h heure de Paris, du lundi au vendredi. Les crons GitHub partent souvent avec
# plusieurs heures de retard : on en programme un toutes les 30 min (en UTC) et le contrôle
# ci-dessous ne lance la séance qu'entre 11h30 et 17h15 (Paris, heure d'été/hiver gérée).
# Si une séance tourne déjà, le groupe « live » met le suivant en file ; il démarrera après 17h50
# et s'arrêtera donc aussitôt.
on:
  schedule:
    - cron: "25,55 9-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 358
    env:
      PYTHONUTF8: "1"  # console Windows en cp1252 : sans ça, les accents/flèches des messages font planter les scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        # tzdata : Windows n'a pas la base des fuseaux horaires que zoneinfo utilise
        run: pip install tzdata numpy MetaTrader5 xlrd
      - name: Dans la plage de séance ?
        id: gate
        shell: python
        env:
          EVENT: ${{ github.event_name }}
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Paris"))
          m = now.hour * 60 + now.minute
          ok = os.environ["EVENT"] == "workflow_dispatch" or (now.weekday() < 5 and 11 * 60 + 30 <= m <= 17 * 60 + 15)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run={'true' if ok else 'false'}\n")
          print(f"{now:%H:%M} Paris : " + ("séance lancée" if ok else "hors plage : arrêt"))
      - name: Installation de MetaTrader 5
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/install_mt5.ps1
      - name: Actu et macro du jour (GPR, EPU, FRED)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_macro.py data/macro
      - name: Page de statut (branche status)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p status_site && cp docs/index.html status_site/
          cd status_site && git init -q && git checkout -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          echo '{"etat": "démarrage"}' > status.json
          git add -A && git commit -qm statut && git push -q -f origin HEAD:status
      - name: Bot
        if: steps.gate.outputs.run == 'true'
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.live --publish
      - name: Journal des trades
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal 2>/dev/null || exit 0
          git commit -qm "Journal de la session du $(date +%F)" || exit 0
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
