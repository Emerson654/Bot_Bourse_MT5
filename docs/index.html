<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Or XAUUSD</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --txt:#e6e8eb; --mute:#8b93a1; --up:#2fbf71; --down:#e5534b; --gold:#d4a72c; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f8; --card:#fff; --txt:#1b1f24; --mute:#5c6573; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,system-ui,sans-serif }
  main { max-width:720px; margin:0 auto; padding:24px 16px }
  h1 { font-size:20px; margin:0 0 4px } .mute { color:var(--mute); font-size:13px }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-top:14px }
  .state { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:600 }
  .dot { width:12px; height:12px; border-radius:50% } table { width:100%; border-collapse:collapse; font-size:14px }
  td,th { text-align:left; padding:6px 4px; border-bottom:1px solid #8882 } th { color:var(--mute); font-weight:500 }
  .up { color:var(--up) } .down { color:var(--down) } .bar { height:8px; background:var(--gold); border-radius:4px }
</style>
</head>
<body><main>
  <h1>🥇 Bot or (XAUUSD) · compte démo</h1>
  <div class="mute">Session 12h00 – 17h50 (Paris), du lundi au vendredi · mise à jour toutes les 5 min</div>
  <div class="card"><div class="state"><span class="dot" id="dot"></span><span id="etat">Chargement…</span></div>
    <div class="mute" id="maj"></div></div>
  <div class="card"><b>Position en cours</b><div id="pos" class="mute">Aucune</div></div>
  <div class="card"><b>Trades du jour</b><table id="trades"></table></div>
  <div class="card"><b>Pondération des stratégies</b><div id="poids"></div></div>
</main>
<script>
const col = e => e.startsWith("en marche") ? "var(--up)" : e.startsWith("en pause") ? "var(--gold)" : "var(--mute)";
const fmt = r => `<span class="${r >= 0 ? 'up' : 'down'}">${r >= 0 ? '+' : ''}${r} R</span>`;
async function load() {
  try {
    const s = await (await fetch("status.json?" + Date.now())).json();
    document.getElementById("etat").textContent = s.etat || "inconnu";
    document.getElementById("dot").style.background = col(s.etat || "");
    document.getElementById("maj").textContent = s.maj ? "Dernière mise à jour : " + s.maj + (s.score !== undefined ? " · score " + s.score : "") : "";
    const p = s.position;
    document.getElementById("pos").innerHTML = p ? `<b>${p.sens}</b> à ${p.entree} · SL ${p.sl} · TP ${p.tp} · latent ${fmt(p.r_latent)}` : "Aucune";
    const t = (s.trades_du_jour || []).filter(x => x.evenement === "sortie");
    document.getElementById("trades").innerHTML = t.length ? "<tr><th>Heure</th><th>Sens</th><th>Entrée</th><th>Sortie</th><th>Résultat</th><th>Raison</th></tr>" +
      t.map(x => `<tr><td>${x.heure.slice(11)}</td><td>${x.sens}</td><td>${x.entree}</td><td>${x.sortie}</td><td>${fmt(x.r)} (${x.pct}%)</td><td>${x.raison}</td></tr>`).join("") : "<tr><td class='mute'>Aucun trade terminé aujourd'hui</td></tr>";
    const w = s.poids || {};
    document.getElementById("poids").innerHTML = Object.entries(w).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      `<div style="margin-top:8px">${k} · ${(v * 100).toFixed(0)} %<div class="bar" style="width:${v * 100}%"></div></div>`).join("") || "<span class='mute'>—</span>";
  } catch (e) { document.getElementById("etat").textContent = "Statut indisponible"; }
}
load(); setInterval(load, 60000);
</script>
</body></html>
