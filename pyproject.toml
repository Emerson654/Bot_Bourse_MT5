[project]
name = "bot-bourse-mt5"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "MetaTrader5>=5.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["numba>=0.60", "pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["."]
