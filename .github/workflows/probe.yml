name: Étape 0 - test MT5 et historique

on:
  workflow_dispatch:
  push:
    paths: [scripts/probe.py, scripts/install_mt5.ps1, .github/workflows/probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de MetaTrader 5
        shell: pwsh
        run: ./scripts/install_mt5.ps1
      - name: Dépendances Python
        run: pip install MetaTrader5
      - name: Connexion, règles XAUUSD et historique
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python scripts/probe.py data
      - uses: actions/upload-artifact@v4
        with:
          name: historique-xauusd
          path: data/*.csv.gz
          retention-days: 30
      - name: Enregistrement de l'historique M5 et H1 dans le dépôt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/mt5 && cp data/XAUUSD_M5.csv.gz data/XAUUSD_H1.csv.gz data/mt5/
          git add data/mt5
          git commit -qm "Historique XAUUSD MetaQuotes-Demo (M5, H1)" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
